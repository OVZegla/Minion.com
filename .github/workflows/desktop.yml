name: Application de bureau

# Construit l'installeur Windows sur un vrai runner Windows.
# Déclenchement manuel, ou automatique sur un tag « v* » (une release est
# alors créée avec les fichiers .exe attachés).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # Les navigateurs Playwright ne servent qu'aux vérifications locales
          # (qa/*.mjs) : inutile de télécharger 500 Mo sur le runner.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Vérifier les types et les tests
        run: |
          npm run typecheck
          npm test

      - name: Construire l'installeur
        run: npm run dist:win
        env:
          # Aucune signature de code : le certificat n'est pas nécessaire
          # pour installer l'application, seulement pour éviter l'écran
          # SmartScreen au premier lancement.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publier les fichiers construits
        uses: actions/upload-artifact@v4
        with:
          name: minion-com-windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Créer la release (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.exe.blockmap
          generate_release_notes: true
