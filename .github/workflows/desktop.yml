name: Application de bureau

# Construit l'installeur Windows sur un vrai runner Windows.
# Déclenchement manuel, ou automatique sur un tag « v* » (une release est
# alors créée avec les fichiers .exe attachés).
on:
  # Déclenchement manuel depuis l'onglet Actions (une fois le workflow présent
  # sur la branche par défaut).
  workflow_dispatch:
  push:
    # Un tag « v1.0.0 » construit l'installeur ET publie une release.
    tags:
      - 'v*'
    # Chaque push sur la branche de travail construit l'installeur et le met
    # à disposition en artefact. Retirer ce bloc pour ne plus consommer de
    # minutes Actions à chaque commit.
    branches:
      - 'claude/minion-student-app-4yopsa'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # Les navigateurs Playwright ne servent qu'aux vérifications locales
          # (qa/*.mjs) : inutile de télécharger 500 Mo sur le runner.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Vérifier les types et les tests
        run: |
          npm run typecheck
          npm test

      - name: Construire l'installeur
        run: npm run dist:win
        env:
          # Signature de code, facultative.
          #
          # Sans certificat, le navigateur annonce un « fichier dangereux » au
          # téléchargement et Windows affiche « Éditeur inconnu » au premier
          # lancement. C'est le comportement normal pour un programme non signé :
          # il ne dit rien du contenu du fichier, seulement que personne n'a
          # attesté de son origine.
          #
          # Pour supprimer ces écrans, ajouter deux secrets au dépôt :
          #   WINDOWS_CERT_BASE64   le fichier .pfx encodé en base64
          #   WINDOWS_CERT_PASSWORD son mot de passe
          # Rien d'autre à changer : la signature se fait alors toute seule.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Calculer les empreintes SHA-256
        shell: pwsh
        run: |
          # Permet de vérifier que le fichier téléchargé est bien celui qui a
          # été construit ici, et qu'il est arrivé entier.
          Get-ChildItem dist-desktop/*.exe, dist-desktop/*.zip | ForEach-Object {
            $empreinte = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$empreinte  $($_.Name)"
          } | Set-Content dist-desktop/SHA256SUMS.txt -Encoding utf8
          Get-Content dist-desktop/SHA256SUMS.txt

      - name: Publier les fichiers construits
        uses: actions/upload-artifact@v4
        with:
          name: minion-com-windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
            dist-desktop/*.exe.blockmap
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Créer la release (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.zip
            dist-desktop/*.exe.blockmap
            dist-desktop/SHA256SUMS.txt
          generate_release_notes: true
