appId: com.minion.app
productName: minion.com
copyright: minion.com

directories:
  output: dist-desktop
  buildResources: electron/assets

# Seul le code Electron est empaqueté dans l'asar ; le serveur Next est
# copié tel quel dans resources/app-server (il doit rester lisible sur disque).
# Le processus principal n'utilise que des modules internes à Electron :
# aucune dépendance npm ne doit entrer dans l'asar (elles servent uniquement
# au build web et pèseraient plusieurs centaines de mégaoctets).
files:
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
  - '!**/*.map'

extraResources:
  - from: desktop/app
    to: app-server
    filter:
      - '**/*'

asar: true

win:
  # Nom affiché comme éditeur du programme. Sans signature de code, Windows
  # continue d'annoncer un éditeur inconnu : c'est le certificat qui atteste
  # de l'origine, pas ce champ.
  signtoolOptions:
    publisherName: minion.com
  target:
    - target: nsis
      arch: [x64]
    # Une archive ZIP remplace l'ancien « portable ». Celui-ci était un
    # exécutable auto-extractible : un antivirus voit un programme qui se
    # décompresse tout seul dans un dossier temporaire et le met en
    # quarantaine par principe. Une archive ordinaire ne déclenche rien.
    - target: zip
      arch: [x64]
  icon: electron/assets/icon.ico
  artifactName: minion.com-${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  # Installation pour l'utilisatrice seule, dans son dossier personnel.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Aucune élévation de privilèges n'est nécessaire pour une installation
  # personnelle. Sans cela, electron-builder embarque « elevate.exe », un
  # utilitaire d'élévation générique que les antivirus signalent très
  # régulièrement — alors que l'application ne s'en sert jamais.
  allowElevation: false
  packElevateHelper: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: minion.com
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  installerHeaderIcon: electron/assets/icon.ico
  deleteAppDataOnUninstall: false
  language: '1036' # français

mac:
  target: dmg
  icon: electron/assets/icon.png
  category: public.app-category.education

linux:
  target:
    - AppImage
    - deb
  icon: electron/assets/icon.png
  category: Education
  maintainer: minion.com
